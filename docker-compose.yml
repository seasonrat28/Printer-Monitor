version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - printer_monitor_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/printer_monitor.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  printer_monitor_db:
