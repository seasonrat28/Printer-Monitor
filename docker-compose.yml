version: '3.8'

services:
  backend:
    build: ./backend
    container_name: printer_monitor_backend
    ports:
      - "8000:8000"
    volumes:
      - printer_monitor_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/printer_monitor.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - LINE_NOTIFY_TOKEN=${LINE_NOTIFY_TOKEN:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_TO_EMAIL=${SMTP_TO_EMAIL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: printer_monitor_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  printer_monitor_db:
