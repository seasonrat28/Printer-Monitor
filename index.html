<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Monitor PLK</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- Header Icons -->
    <div class="header-icons">
        <button class="icon-btn icon-btn-alert" onclick="printerMonitor.toggleAlertPanel()" title="Alerts" style="position: relative;">
            🔔
            <span id="alertBadge" class="alert-badge" style="display: none;">0</span>
        </button>
        <button class="icon-btn icon-btn-setting" onclick="window.location.href='/setting'" title="Settings">
            ⚙️
        </button>
        <button class="icon-btn icon-btn-refresh" onclick="printerMonitor.refreshAllData()" title="Refresh All">
            🔄
        </button>
        <button class="icon-btn icon-btn-auto-refresh" onclick="printerMonitor.toggleAutoRefresh()" title="Toggle Auto Refresh">
            ⏰
        </button>
        <button id="expandAllBtn" class="icon-btn icon-btn-expand-all" onclick="printerMonitor.logManager.expandAll()" title="ขยาย/ย่อประวัติทุก Card">
            📋 ขยายทั้งหมด
        </button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🖨️ FUJIFILM Printer Monitor</h1>
            <p>ตรวจสอบสถานะ Toner และ Drum Unit - Apeos 4620 SZ</p>
            <div class="developed-by">
                <p>พัฒนา By <strong>YAI</strong> (IT Support PLK) Version 3.0</p>
            </div>
            <div id="autoRefreshIndicator" class="auto-refresh-indicator" style="display: none;"></div>
        </div>

        <!-- Controls Section -->
        <div class="controls">
            <div class="combined-search-section">
                <div class="search-tabs">
                    <button class="search-tab active" onclick="switchTab('single')">ค้นหา IP เดียว</button>
                    <button class="search-tab" onclick="switchTab('range')">ค้นหาช่วง IP</button>
                    <button class="search-tab" onclick="switchTab('favorites')">รายการโปรด</button>
                </div>

                <!-- Single IP Search -->
                <div id="singleSearch" class="search-content active">
                    <div class="control-row">
                        <div class="form-group">
                            <label for="singleIp">🔍 IP Address:</label>
                            <input type="text" id="singleIp" placeholder="เช่น 192.168.1.100">
                        </div>
                        <button class="btn btn-primary" onclick="checkSingle()">🔍 ค้นหา</button>
                        <button class="btn btn-clear" onclick="clearResults()">🗑️ ล้าง</button>
                    </div>
                    <div id="recentIPsList" style="margin-top: 15px;"></div>
                </div>

                <!-- Range IP Search -->
                <div id="rangeSearch" class="search-content">
                    <div class="control-row">
                        <div class="form-group">
                            <label for="baseIp">📡 Base IP (xxx.xxx.xxx):</label>
                            <input type="text" id="baseIp" placeholder="เช่น 192.168.1">
                        </div>
                        <div class="form-group small">
                            <label for="startRange">เริ่มต้น:</label>
                            <input type="number" id="startRange" min="1" max="254" value="1">
                        </div>
                        <div class="form-group small">
                            <label for="endRange">สิ้นสุด:</label>
                            <input type="number" id="endRange" min="1" max="254" value="254">
                        </div>
                        <button class="btn btn-primary" onclick="checkRange()">🔍 ค้นหา</button>
                        <button class="btn btn-clear" onclick="clearResults()">🗑️ ล้าง</button>
                    </div>
                </div>

                <!-- Favorites Search -->
                <div id="favoritesSearch" class="search-content">
                    <div id="favoritesList"></div>
                    <div class="control-row" style="margin-top: 15px;">
                        <button class="btn btn-success" onclick="printerMonitor.searchFavorites()">🔍 ค้นหารายการโปรด</button>
                        <button class="btn btn-clear" onclick="clearResults()">🗑️ ล้าง</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results">
            <!-- Search Results -->
            <div class="section-header">
                <h3 onclick="toggleSection('searchResults')" style="cursor: pointer; flex: 1;">🔍 Search Results</h3>
                <div class="section-controls">
                    <select id="searchFilterSelect" class="filter-select" onchange="printerMonitor.searchSection.applySort()">
                        <option value="ip-asc">IP (น้อย → มาก)</option>
                        <option value="ip-desc">IP (มาก → น้อย)</option>
                        <option value="toner-asc">Toner (น้อย → มาก)</option>
                        <option value="toner-desc">Toner (มาก → น้อย)</option>
                        <option value="drum-asc">Drum (น้อย → มาก)</option>
                        <option value="drum-desc">Drum (มาก → น้อย)</option>
                    </select>
                    <button class="btn-icon export-btn" onclick="printerMonitor.exportSearchData()" title="Export to CSV">📥</button>
                    <span id="searchToggle" class="toggle-icon" onclick="toggleSection('searchResults')" style="cursor: pointer;">▼</span>
                </div>
            </div>

            <div id="searchFilterInfo" class="filter-info">
                <span id="searchFilterText"></span>
                <button class="filter-clear-btn" onclick="printerMonitor.searchSection.clearFilter()">ล้าง</button>
            </div>

            <div id="searchStats" class="stats"></div>
            <div class="collapsible-content" id="searchResults">
                <div id="searchLoading" class="loading" style="display: none;"></div>
                <div id="searchGrid" class="printer-grid"></div>
            </div>

            <!-- Database Results -->
            <div class="section-header">
                <h3 onclick="toggleSection('databaseResults')" style="cursor: pointer; flex: 1;">📊 Database Printers</h3>
                <div class="section-controls">
                    <select id="databaseFilterSelect" class="filter-select" onchange="printerMonitor.databaseSection.applySort()">
                        <option value="ip-asc">IP (น้อย → มาก)</option>
                        <option value="ip-desc">IP (มาก → น้อย)</option>
                        <option value="toner-asc">Toner (น้อย → มาก)</option>
                        <option value="toner-desc">Toner (มาก → น้อย)</option>
                        <option value="drum-asc">Drum (น้อย → มาก)</option>
                        <option value="drum-desc">Drum (มาก → น้อย)</option>
                    </select>
                    <button class="btn-icon export-btn" onclick="printerMonitor.exportDatabaseData()" title="Export to CSV">📥</button>
                    <span id="databaseToggle" class="toggle-icon" onclick="toggleSection('databaseResults')" style="cursor: pointer;">▼</span>
                </div>
            </div>

            <!-- Search/Filter Bar for Database -->
            <div class="search-filter-bar" onclick="event.stopPropagation()">
                <input 
                    type="text" 
                    id="databaseSearch" 
                    class="search-input" 
                    placeholder="🔍 ค้นหา IP, ชื่อเครื่อง, Location..."
                    onclick="event.stopPropagation()"
                >
                <select id="databaseSupplyFilter" class="filter-select" onclick="event.stopPropagation()">
                    <option value="none">ทั้งหมด</option>
                    <option value="toner-10">Toner ≤ 10%</option>
                    <option value="toner-20">Toner ≤ 20%</option>
                    <option value="toner-30">Toner ≤ 30%</option>
                    <option value="drum-10">Drum ≤ 10%</option>
                    <option value="drum-20">Drum ≤ 20%</option>
                    <option value="drum-30">Drum ≤ 30%</option>
                </select>
                <button class="btn-clear-filters" onclick="event.stopPropagation(); printerMonitor.databaseSection.clearAllFilters()">
                    🗑️ ล้างตัวกรอง
                </button>
            </div>

            <div id="databaseFilterInfo" class="filter-info">
                <span id="databaseFilterText"></span>
                <button class="filter-clear-btn" onclick="printerMonitor.databaseSection.clearAllFilters()">ล้าง</button>
            </div>

            <div id="databaseStats" class="stats"></div>
            <div class="collapsible-content" id="databaseResults">
                <div id="databaseLoading" class="loading" style="display: none;"></div>
                <div id="databaseGrid" class="printer-grid"></div>
            </div>
        </div>
    </div>

    <!-- Alert Panel -->
    <div id="alertPanelContainer" class="alert-panel-container">
        <div class="alert-panel-header">
            <h3>🔔 การแจ้งเตือน</h3>
            <button class="alert-panel-close" onclick="printerMonitor.toggleAlertPanel()">×</button>
        </div>
        <div class="alert-panel-body">
            <div id="alertPanel">
                <div class="no-alerts">✅ ไม่มีการแจ้งเตือน ทุกอย่างปกติ</div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
